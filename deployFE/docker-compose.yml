services:
  frontend-example:
    image: ${FRONTEND_IMAGE}
    container_name: ${FRONTEND_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${FRONTEND_APP_PATH}:/usr/share/nginx/html:ro
      - ${FRONTEND_CONF}:/etc/nginx/templates/default.conf.template:ro
    command: /bin/sh -c "apk add --no-cache gettext > /dev/null 2>&1 || true; envsubst '\$FRONTEND_PATH_PREFIX' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
    networks:
      - qtm-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${FRONTEND_CONTAINER_NAME}.rule=${FRONTEND_TRAEFIK_RULE}"
      - "traefik.http.routers.${FRONTEND_CONTAINER_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${FRONTEND_CONTAINER_NAME}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${FRONTEND_CONTAINER_NAME}.service=${FRONTEND_CONTAINER_NAME}"
      - "traefik.http.services.${FRONTEND_CONTAINER_NAME}.loadbalancer.server.port=80"

networks:
  qtm-net:
    driver: bridge
    external: true
    name: ${FRONTEND_NETWORK}