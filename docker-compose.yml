
services:
  mysql:
    image: mysql:8.0
    container_name: qtmdashboard-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dago
      MYSQL_DATABASE: QTMDashboard
    ports:
      - "3307:3306"
    volumes:
      - qtmdashboard-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pdago --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qtmdashboard-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/QTMDashboard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: dago
    ports:
      - "8086:8086"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qtmdashboard-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: always

volumes:
  qtmdashboard-mysql-data:
    driver: local
