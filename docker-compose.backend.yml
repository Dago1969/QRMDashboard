services:
  qrm-backend:
    image: qrm-dashboard-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qrm-backend
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    # Aggiungi qui eventuali variabili d'ambiente custom
    # volumes:
    #   - ./logs:/app/logs
    restart: unless-stopped

# Questo file docker-compose è pensato per avviare solo il backend Spring Boot.
# Assicurati che il Dockerfile sia presente nella root e che esponga la porta 8086.
# Modifica SPRING_PROFILES_ACTIVE secondo le tue esigenze.
