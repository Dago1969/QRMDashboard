<div class="container">
	<div class="card change-password-card">
		<h1>{{ t('changePassword.title') }}</h1>
		<p class="description">{{ t('changePassword.description') }}</p>

		<form [formGroup]="form" (ngSubmit)="onSubmit()">
			<label for="currentPassword">{{ t('changePassword.label.currentPassword') }}</label>
			<input id="currentPassword" type="password" formControlName="currentPassword" autocomplete="current-password" />

			<label for="newPassword">{{ t('changePassword.label.newPassword') }}</label>
			<input id="newPassword" type="password" formControlName="newPassword" autocomplete="new-password" />
			<p class="hint">{{ t('changePassword.hint.robustPassword') }}</p>

			<label for="confirmPassword">{{ t('changePassword.label.confirmPassword') }}</label>
			<input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" />

			<div class="actions">
				<button class="btn btn-primary" type="submit">{{ t('changePassword.action.submit') }}</button>
				<button class="btn btn-secondary" type="button" (click)="backToLogin()">{{ t('changePassword.action.backToLogin') }}</button>
			</div>
		</form>

		<p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
		<p class="success" *ngIf="successMessage">{{ successMessage }}</p>
	</div>
</div>
