<div class="container">
  <div class="card reset-password-card">
    <h1>{{ t('resetPassword.title') }}</h1>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label for="newPassword">{{ t('resetPassword.label.newPassword') }}</label>
      <input id="newPassword" type="password" formControlName="newPassword" autocomplete="new-password" />
      <label for="confirmPassword">{{ t('resetPassword.label.confirmPassword') }}</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      <div class="actions">
        <button class="btn btn-primary" type="submit">{{ t('resetPassword.action.submit') }}</button>
        <button class="btn btn-secondary" type="button" routerLink="/login">{{ t('resetPassword.action.backToLogin') }}</button>
      </div>
    </form>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  </div>
</div>
