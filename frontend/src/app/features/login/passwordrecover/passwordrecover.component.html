<div class="container">
	<div class="card recover-card">
		<div class="login-logo">
			<img src="assets/quicare-logo.png" alt="QuiCare logo" style="max-width: 320px; width: 100%; height: auto;" />
		</div>
		<form>
			<input type="email" placeholder="Inserisci Email" class="recover-input" />
			<div class="recover-hint text-light">Usa l’indirizzo fornito in fase di registrazione</div>
			<div class="recover-btns">
				<button type="button" class="btn btn-outline" routerLink="/login">Annulla</button>
				<button type="submit" class="btn btn-primary">Invia</button>
			</div>
		</form>
		<div class="recover-desc text-dark">
			Riceverai una mail con il link per creare la<br />nuova password
		</div>
	</div>
</div>
