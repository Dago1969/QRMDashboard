<div class="container">
  <div class="card login-card">
    <div class="login-logo">
      <img src="assets/quicare-logo.png" alt="QuiCare logo" style="max-width: 320px; width: 100%; height: auto;" />
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label for="username">{{ t('login.label.username') }}</label>
      <input id="username" type="text" formControlName="username" autocomplete="username" />

      <label for="password">{{ t('login.label.password') }}</label>

      <input id="password" type="password" formControlName="password" autocomplete="current-password" />

      <div class="login-link-recover">
        <a routerLink="/passwordrecover" class="link-recover">{{ t('login.link.recover') }}</a>
      </div>

      <div class="login-btn-center">
        <button class="btn btn-primary" type="submit">{{ t('login.action.submit') }}</button>
      </div>
    </form>

    <p class="info" *ngIf="infoMessage">{{ infoMessage }}</p>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <div class="text-desc">
      {{ t('login.text.description') }}
    </div>
  </div>
</div>
