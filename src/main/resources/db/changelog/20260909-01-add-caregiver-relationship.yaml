databaseChangeLog:
  - changeSet:
      id: 20260909-01-add-caregiver-relationship
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: patients
      changes:
        - addColumn:
            tableName: patients
            columns:
              - column:
                  name: caregiver_relationship
                  type: varchar(64)
                  defaultValue: ''
              - column:
                  name: otp_recipient
                  type: varchar(64)
                  defaultValue: 'primaryPhone'
      rollback:
        - dropColumn:
            tableName: patients
            columnName: caregiver_relationship
        - dropColumn:
            tableName: patients
            columnName: otp_recipient
